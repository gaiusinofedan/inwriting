<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INWRITING</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#0e0e10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="INWRITING">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital@0;1&family=Lora:ital@0;1&family=Crimson+Pro:ital@0;1&family=Libre+Baskerville:ital@0;1&family=Spectral:ital@0;1&family=Newsreader:ital@0;1&family=Playfair+Display:ital@0;1&family=Literata:ital@0;1&family=Courier+Prime:ital@0;1&family=IBM+Plex+Mono&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#0e0e10;--panel:#16161a;--text:#d9d5cc;--muted:#6f6c66;--accent:#c9a46a;--line:#26262b;--font:'Cormorant Garamond',Georgia,serif;--size:22px;--lh:1.7;--measure:38em;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="charcoal"]{--bg:#1c1c1f;--panel:#232327;--text:#dcdad4;--muted:#77756f;--line:#303035}
:root[data-theme="warm"]{--bg:#16120e;--panel:#1e1913;--text:#e0d6c3;--muted:#7d7261;--accent:#d0a35c;--line:#2b241b}
:root[data-theme="blue"]{--bg:#0b0f17;--panel:#121722;--text:#cfd6e4;--muted:#657089;--accent:#8fb0e8;--line:#1c2433}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#side{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:none;flex-direction:column;overflow:hidden}
#side.open{display:flex}
@media(max-width:800px){#side{position:fixed;inset:env(safe-area-inset-top,0px) 0 0 0;width:auto;z-index:25}}
.sh{display:flex;gap:8px;padding:14px;align-items:center}
.sh b{flex:1;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#tree{flex:1;overflow-y:auto;padding:0 8px 20px}
.row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted)}
.row:hover{background:var(--bg)}.row.cur{background:var(--bg);color:var(--text)}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{opacity:0;padding:0 6px}.row:hover .m,.row.cur .m{opacity:1}
@media(hover:none){.row .m{opacity:1}}
.kids{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:4px 10px 10px}
.acts button,.acts select{font-size:12px;padding:4px 8px}
select,input.ren{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}
input.ren{flex:1;min-width:0;padding:4px 8px;font-size:14px}
.flex{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:4px;padding:10px 12px;font-size:13px;color:var(--muted);transition:opacity .4s}
header.hide,footer.hide{opacity:0}header:hover,footer:hover{opacity:1}
.brand{letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:500;color:var(--text)}.sp{flex:1}
button{font:inherit;background:none;border:0;color:var(--muted);border-radius:8px;padding:6px 8px;cursor:pointer}
button:hover{color:var(--text)}button.on{color:var(--accent)}
button.bare{border:0;padding:2px 6px}
main{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:6vh 20px 40vh;scroll-behavior:auto}
.tw main{scroll-behavior:smooth}
.page{width:100%;max-width:var(--measure)}
#title{width:100%;background:none;border:0;outline:0;color:var(--text);font-family:var(--font);font-size:calc(var(--size)*1.5);margin-bottom:.8em;padding:0}
#title::placeholder,#body::placeholder{color:var(--muted);opacity:.6;font-style:italic}
#body{width:100%;min-height:60vh;background:none;border:0;outline:0;resize:none;color:var(--text);font-family:var(--font);font-size:var(--size);line-height:var(--lh);padding:0;overflow:hidden;caret-color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
footer{display:flex;gap:16px;padding:8px 16px;font-size:12px;color:var(--muted);transition:opacity .4s}
#panel{position:fixed;right:12px;top:calc(48px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 24px));max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:none;z-index:40;box-shadow:0 20px 60px #0008}
#panel.open{display:block}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}label:first-child{margin-top:0}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fonts button{font-size:15px;text-align:left;padding:8px 10px}
.r{display:flex;gap:8px;align-items:center}input[type=range]{flex:1;accent-color:var(--accent)}
input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.sw{width:30px;height:30px;border-radius:50%;padding:0}small{color:var(--muted);font-size:11px;display:block;margin-top:6px}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:340px;text-align:center}
#login h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:38px;margin:0 0 6px}
#login p{color:var(--muted);font-size:14px;margin:0 0 24px}
#login input{width:100%;box-sizing:border-box;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit;font-size:16px}
#login button{width:100%;padding:12px}#login #sendLink{background:var(--panel);color:var(--text)}#login .lnk{margin-top:14px;font-size:13px}
#loginMsg{min-height:20px;color:var(--accent);font-size:13px;margin-top:12px}
#acct{display:none}
#share{position:fixed;inset:0;background:#000a;z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
#share .card{width:100%;max-width:420px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.shh{display:flex;align-items:center}.shh b{flex:1;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.shT{font-family:var(--font);font-size:22px;margin:8px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shNote{display:none;color:var(--muted);font-size:14px;margin-top:10px}
.person{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}.person span{flex:1;overflow:hidden;text-overflow:ellipsis}
#shMsg{min-height:18px;color:var(--accent);font-size:13px;margin-top:10px}
#shOwn select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px}
.sec{padding:14px 10px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#pres{opacity:.7;margin-left:12px}.page{position:relative}#body{position:relative;z-index:1}
#hl{position:absolute;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;color:transparent;z-index:0;margin:0}
#hl mark{color:transparent;border-radius:2px}
#ann{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 24px));max-height:calc(100vh - 120px);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:35;box-shadow:0 20px 60px #0008;overflow:hidden}
#ann.open{display:flex}
#annNew{display:none;padding:12px 14px;border-bottom:1px solid var(--line)}
#annNew q{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-bottom:8px}
#annNew textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;resize:none;height:64px;margin-bottom:6px}
#annList{overflow-y:auto;padding:6px 0}
.ai{padding:10px 14px;font-size:14px;cursor:pointer;border-left:3px solid transparent}
.ai.on{background:var(--bg)}.ai.rs{opacity:.45}
.ai b{font-size:12px;font-weight:600}.ai .q{color:var(--muted);font-style:italic;font-size:13px;margin:2px 0}.ai .act{margin-top:4px;font-size:12px}
@media(max-width:800px){#ann{top:auto;bottom:12px;max-height:48vh}}
#annF{display:none;gap:12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
#annF button,#hisBtn,#annX{background:none;border:0;font:inherit;cursor:pointer;padding:0}
#hisBtn{color:var(--muted);font-size:12px;margin-right:12px}
#annAdd{color:var(--accent);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;padding:0 12px 0 0}
#annX{color:var(--muted);font-size:13px}
.ai .act button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0 12px 0 0}
.rp{margin:8px 0 0 8px;padding-left:10px;border-left:1px solid var(--line);font-size:13px}
#hist{position:fixed;inset:0;background:#000a;z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
#hist .card{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
#hist .shh{display:flex;justify-content:space-between;margin-bottom:10px}
.hv{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.hv .t{cursor:pointer}
.hb{display:none;margin-top:8px}.hb pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted);max-height:34vh;overflow-y:auto;margin:0 0 8px}
.hb button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0}
@media(max-width:800px),(hover:none),(pointer:coarse){#focusBtn{display:none}}
#fmt{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;display:none;gap:2px;padding:4px;background:var(--panel);border-radius:12px;box-shadow:0 8px 30px #000a;z-index:28}
#fmt.show{display:flex}
#fmt button{min-width:40px;padding:8px 10px;font-size:15px;color:var(--text)}
#fmt button:hover{color:var(--accent)}
#rd{position:absolute;left:0;right:0;display:none;z-index:2;font-family:var(--font);font-size:var(--size);line-height:var(--lh);color:var(--text);overflow-wrap:break-word;cursor:text}
#rd.on{display:block}#body.rest{opacity:0;pointer-events:none}
#rd .l{white-space:pre-wrap;min-height:calc(var(--size)*var(--lh))}
#rd .h1{font-size:1.45em;line-height:1.25;margin:.5em 0 .15em}
#rd .h2{font-size:1.2em;line-height:1.3;margin:.4em 0 .1em}
#rd .q{border-left:2px solid var(--accent);padding-left:1em;color:var(--muted)}
#rd .sb{text-align:center;color:var(--muted);letter-spacing:.5em}
#rd .b{font-weight:700}#rd .i{font-style:italic}
</style>
</head>
<body>
<div id="login"><div class="box"><h1>INWRITING</h1><p>Sign in to keep your writing in sync.</p><input id="email" type="email" placeholder="you@email.com" autocomplete="email"><button id="sendLink">Email me a sign-in link</button><div id="loginMsg"></div><button class="lnk" id="localOnly">Use on this device only</button></div></div>
<div id="share"><div class="card"><div class="shh"><b>Share</b><button class="bare" id="shClose">✕</button></div><div class="shT" id="shTitle"></div>
<div id="shNote"></div>
<div id="shOwn"><label>Add people</label><div class="r"><input type="text" id="shEmail" placeholder="Email address"><select id="shRole"><option value="edit">Can edit</option><option value="comment">Can comment</option><option value="view">Can view</option></select><button id="shAdd">Add</button></div>
<div id="people"></div>
<label>Link access</label><div class="r"><select id="linkRole"><option value="">Restricted</option><option value="view">Anyone signed in can view</option><option value="comment">Anyone signed in can comment</option><option value="edit">Anyone signed in can edit</option></select></div>
<div class="r" style="margin-top:8px"><input type="text" id="shLink" readonly><button id="shCopy">Copy link</button></div>
<small>Everyone signs in with their email to open a shared note. Add their email above so it appears in their library, or send the link.</small></div>
<div id="shMsg"></div></div></div>
<aside id="side">
  <div class="sh"><b>Library</b><button id="newNote">+ Note</button><button id="newFolder">+ Folder</button><button class="bare" id="closeSide">✕</button></div>
  <div id="tree"></div>
</aside>
<div class="flex">
<header id="hd">
  <button id="menuBtn">☰</button><span class="brand">INWRITING</span><span class="sp"></span>
  <button id="focusBtn">Focus</button><button id="revBtn" style="display:none">Review</button><button id="shareBtn" style="display:none">Share</button><button id="copyBtn">Copy</button><button id="setBtn">Aa</button>
</header>
<main id="main"><div class="page">
  <input id="title" placeholder="Untitled" autocomplete="off">
  <div id="hl" aria-hidden="true"></div><div id="rd" aria-hidden="true"></div><textarea id="body" placeholder="Begin anywhere." spellcheck="true"></textarea>
</div></main>
<div id="fmt"><button data-f="b" title="Bold"><b>B</b></button><button data-f="i" title="Italic"><i>I</i></button><button data-f="h" title="Heading">H</button><button data-f="q" title="Quote">❝</button><button data-f="s" title="Scene break">⁂</button></div>
<footer id="ft"><span id="wc">0 words</span><span id="rt"></span><span id="pres"></span><span class="sp"></span><button id="hisBtn" style="display:none">History</button><span id="saved"></span></footer>
</div>
<div id="ann"><div id="annF"></div><div id="annNew"><q id="annQ"></q><textarea id="annT" placeholder="Add a comment"></textarea><button id="annAdd">Comment</button><button id="annX">Cancel</button></div><div id="annList"></div></div>
<div id="hist"><div class="card"><div class="shh"><b>History</b><button class="bare" id="hClose">✕</button></div><div id="hList"></div></div></div>
<div id="panel">
  <label>Typeface</label><div class="fonts" id="fonts"></div>
  <label>Any Google Font</label>
  <div class="r"><input type="text" id="custom" placeholder="e.g. Fraunces"><button id="loadFont">Use</button></div>
  <small id="fontMsg">Type any name from fonts.google.com</small>
  <label>Size</label><div class="r"><input type="range" id="size" min="16" max="36"></div>
  <label>Line height</label><div class="r"><input type="range" id="lh" min="12" max="22"></div>
  <label>Column width</label><div class="r"><input type="range" id="measure" min="26" max="56"></div>
  <label>Background</label><div class="r" id="themes"></div>
  <div id="acct"><label>Account</label><small id="who"></small><div class="r" style="margin-top:8px"><button id="signOut">Sign out</button></div></div>
</div>
<script>/**

 * limitations under the License.
